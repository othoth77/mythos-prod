# =====================================================
# Mythos OS — VPS Final Gate (self-hosted runner, read-only)
#
# Runs ONLY on manual dispatch, ONLY on the mythos-vps self-hosted
# runner (provisioned per docs/VPS_RUNNER_PROVISIONING.md). Every step
# is read-only on the host: no service restart, no permission change,
# no governance mutation, no store write. Root-only remediations
# (docker-group removal, store provisioning) remain operator actions
# by design — the runner has NoNewPrivileges and cannot escalate.
#
# NOTE: .github/workflows/** is a governance-protected path — the
# on-VPS relay refuses to deliver commits touching it without an
# explicit approval. Actions executes this file from GitHub, so the
# workflow runs regardless; approve delivery when updating the VPS
# checkout of main past this commit.
# =====================================================
name: VPS Final Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-final-gate
  cancel-in-progress: false

jobs:
  smoke:
    name: Runner smoke + identity boundary
    runs-on: [self-hosted, mythos-vps]
    timeout-minutes: 10
    steps:
      - name: Harmless test job — identity report
        run: |
          echo "hostname: $(hostname)"
          echo "user: $(id -un) uid=$(id -u)"
          echo "groups: $(id -nG)"
          echo "os: $(. /etc/os-release && echo "$PRETTY_NAME")"
      - name: Assert least-privilege identity (fail-closed)
        run: |
          set -eu
          [ "$(id -u)" -ne 0 ] || { echo "FAIL: runner is root"; exit 1; }
          for banned in docker sudo mythos-gov root; do
            if id -nG | tr ' ' '\n' | grep -qx "$banned"; then
              echo "FAIL: runner is in banned group $banned"; exit 1
            fi
          done
          if sudo -n true 2>/dev/null; then
            echo "FAIL: runner has passwordless sudo"; exit 1
          fi
          echo "PASS: non-root, no docker/sudo/mythos-gov, no sudo -n"
      - name: Assert governance material unreachable (values never read)
        run: |
          set -eu
          ! test -r /etc/mythos/governance.key || { echo "FAIL: can read governance.key"; exit 1; }
          ! ls /var/lib/mythos/governance/approvals >/dev/null 2>&1 || { echo "FAIL: can list approval store"; exit 1; }
          ! test -r /var/run/docker.sock || { echo "FAIL: can reach docker socket"; exit 1; }
          echo "PASS: governance.key EACCES, approvals EACCES, docker.sock unreachable"

  gate:
    name: VPS baseline + governance + suites (read-only)
    needs: smoke
    runs-on: [self-hosted, mythos-vps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: VPS baseline (section 5 of the gate order)
        run: |
          set -eu
          echo "hostname:        $(hostname)"
          echo "runner user:     $(id -un) ($(id -nG))"
          echo "node:            $(node --version 2>/dev/null || echo MISSING)"
          echo "workflow sha:    $GITHUB_SHA"
          echo "deploy groups:   $(id -nG deploy 2>/dev/null || echo 'deploy account not visible')"
          echo "docker group:    $(getent group docker || echo 'no docker group')"
          echo "mythos-gov:      $(getent group mythos-gov || echo 'no mythos-gov group')"
          if [ -d /home/deploy/projects/mythos-prod ]; then
            echo "vps checkout:    present (contents not readable from this identity by policy — reported as-is)"
          fi

      - name: Docker-group finding (section 6 — report only, remediation is root-only)
        run: |
          set -eu
          if getent group docker | cut -d: -f4 | tr ',' '\n' | grep -qx deploy; then
            echo "FINDING OPEN: deploy is in the docker group (root-equivalent)."
            echo "Operator remediation (root): gpasswd -d deploy docker && re-run this gate."
            echo "docker_finding=open" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PASS: deploy is NOT in the docker group"
          fi

      - name: Governance invariant suite (identity-agnostic, read-only)
        run: node tests/mythos-governance-invariant-test.js

      - name: Knowledge configuration state (section 8 — verified, fail-closed)
        run: |
          set -eu
          # The active executor knowledge wiring lives under
          # projects/mythos-ai-executor/config/knowledge.json. The gate
          # asserts the activated values instead of reporting whatever it
          # finds: a missing, unparseable or de-activated config fails the
          # gate rather than being swallowed.
          node -e '
            const fs = require("fs");
            const PATH = "projects/mythos-ai-executor/config/knowledge.json";
            const EXPECTED_STORE_ROOT = "/home/deploy/othk-store";
            let c;
            try {
              c = JSON.parse(fs.readFileSync(PATH, "utf8"));
            } catch (e) {
              console.error("FAIL: cannot read/parse " + PATH + ": " + e.message);
              process.exit(1);
            }
            const failures = [];
            if (c.enabled !== true) failures.push("enabled must be true, got " + JSON.stringify(c.enabled));
            if (c.store_root !== EXPECTED_STORE_ROOT) {
              failures.push("store_root must be " + JSON.stringify(EXPECTED_STORE_ROOT) + ", got " + JSON.stringify(c.store_root));
            }
            if (failures.length) {
              failures.forEach(function (f) { console.error("FAIL: " + f); });
              process.exit(1);
            }
            console.log("PASS: " + PATH + " enabled=true store_root=" + c.store_root);
          '

      - name: E2E lifecycle suite — expected host refusal is the PASS condition
        run: |
          set +e
          out="$(node tests/mos-e2e-lifecycle-test.js 2>&1)"; code=$?
          echo "$out" | tail -20
          if [ $code -eq 0 ]; then
            echo "E2E suite ran to completion on this host (no registered-checkout refusal)."
          else
            if echo "$out" | grep -qi 'refus\|registered checkout\|this host'; then
              echo "PASS(expected): suite hard-refuses on the production host by design — recorded, not overridden."
            else
              echo "FAIL: suite failed for a reason other than the designed host refusal."
              exit 1
            fi
          fi

  # ===================================================================
  # BRANCH-ONLY DIAGNOSTIC — not proposed for main.
  #
  # Identifies the untracked entries under
  # projects/infrastructure/github-runner/ in the deploy checkout at
  # /home/deploy/projects/mythos-prod, before any production sync.
  #
  # HARD CONSTRAINTS (owner order, 2026-08-21): no deploy, pull, reset,
  # stash, delete or chown; nothing on the VPS is modified. Only
  # metadata is read — names, owners, modes, sizes, timestamps and
  # file(1) types. File CONTENTS are NEVER printed: this job contains
  # no cat/head/tail/grep of any target file, by construction.
  #
  # The runner is mythos-runner (NoNewPrivileges, no sudo,
  # ProtectHome=read-only) and CANNOT become deploy. Every probe exits 0
  # and reports EACCES explicitly, so a DAC denial is recorded as the
  # finding rather than failing the gate.
  # ===================================================================
  diagnose:
    name: Deploy-checkout dirty-tree diagnostic (read-only, branch-only)
    needs: smoke
    runs-on: [self-hosted, mythos-vps]
    timeout-minutes: 10
    steps:
      - name: Identity and reachability
        run: |
          set +e
          R=/home/deploy/projects/mythos-prod
          echo "hostname:  $(hostname)"
          echo "identity:  $(id -un) uid=$(id -u) groups=$(id -nG)"
          echo "target:    $R"
          echo
          echo "--- path chain (stat only, no contents) ---"
          for p in /home /home/deploy /home/deploy/projects "$R" "$R/.git" \
                   "$R/projects/infrastructure/github-runner"; do
            out="$(stat -c '%A %U:%G %n' "$p" 2>&1)" \
              && echo "  $out" || echo "  UNREADABLE $p -> $out"
          done
          echo
          if [ -r "$R" ] && [ -x "$R" ]; then
            echo "READABLE: proceeding with the probes."
          else
            echo "EACCES: mythos-runner cannot traverse the deploy checkout."
            echo "That is the expected DAC boundary, not a fault."
          fi
          exit 0

      - name: 1of6 — full untracked paths
        run: |
          set +e
          R=/home/deploy/projects/mythos-prod
          echo '=== FULL UNTRACKED PATHS ==='
          git -C "$R" -c safe.directory="$R" status --short -uall \
            -- projects/infrastructure/github-runner/ 2>&1
          echo "(exit=$?)"; exit 0

      - name: 2of6 — owners and timestamps
        run: |
          set +e
          R=/home/deploy/projects/mythos-prod
          D="$R/projects/infrastructure/github-runner"
          echo '=== OWNERS / TIMESTAMPS ==='
          ls -la --time-style=full-iso "$D" 2>&1
          echo
          echo '--- entries newer than .git/HEAD ---'
          find "$D" -newer "$R/.git/HEAD" \
            -printf '%TY-%Tm-%Td %TH:%TM  %10s  %u:%g  %p\n' 2>&1 | sort
          echo "(exit=$?)"; exit 0

      - name: 3of6 — file types (type only, never contents)
        run: |
          set +e
          D=/home/deploy/projects/mythos-prod/projects/infrastructure/github-runner
          echo '=== FILE TYPES ==='
          find "$D" -type f ! -path '*/.git/*' -exec file {} \; 2>&1
          echo "(exit=$?)"; exit 0

      - name: 4of6 — credential/runtime NAMES ONLY (contents never read)
        run: |
          set +e
          D=/home/deploy/projects/mythos-prod/projects/infrastructure/github-runner
          echo '=== CREDENTIAL/RUNTIME NAMES ONLY ==='
          echo '(-ls prints mode, owner, size, mtime, name — no contents)'
          find "$D" \( -name '.credentials*' -o -name '.runner' \
                       -o -name '*.env' -o -name '*token*' \
                       -o -name '*.tar.gz' \) -ls 2>&1
          echo "(exit=$?)"; exit 0

      - name: 5of6 — tracked runner files unmodified?
        run: |
          set +e
          R=/home/deploy/projects/mythos-prod
          echo '=== TRACKED RUNNER FILES ==='
          git -C "$R" -c safe.directory="$R" status --short \
            -- 'projects/infrastructure/github-runner/*.sh' \
               'projects/infrastructure/github-runner/*.service' 2>&1
          echo "(empty above = all three tracked files unmodified)"
          exit 0

      - name: 6of6 — repository state
        run: |
          set +e
          R=/home/deploy/projects/mythos-prod
          echo '=== REPOSITORY STATE ==='
          echo -n 'HEAD:        '; git -C "$R" -c safe.directory="$R" rev-parse HEAD 2>&1
          echo -n 'origin/main: '; git -C "$R" -c safe.directory="$R" rev-parse origin/main 2>&1
          echo -n 'branch:      '; git -C "$R" -c safe.directory="$R" branch --show-current 2>&1
          echo
          echo '--- full short status (paths only) ---'
          git -C "$R" -c safe.directory="$R" status --short 2>&1
          exit 0
