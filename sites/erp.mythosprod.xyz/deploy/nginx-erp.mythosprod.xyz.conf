# erp.mythosprod.xyz — MYTHOS ERP (new multi-tenant app), public.
# Tracked copy of /etc/nginx/sites-available/erp.mythosprod.xyz (root-owned).
#
# Runbook: sites/erp.mythosprod.xyz/deploy/README.md (erp-api) and
#          sites/erp.mythosprod.xyz/DEPLOYMENT.md (legacy PHP ERP, superseded)
# Status:  docs/ERP_SECURITY_STATUS.md §5 (Stage 6 — security status of the NEW ERP)
#
# 2026-09-07: this hostname serves the NEW ERP (sites/erp.mythosprod.xyz/app +
# erp-api on 127.0.0.1:8787), not the legacy PHP ERP. The legacy static-preservation
# docroot (/var/www/erp.mythosprod.xyz) is UNCHANGED on disk and simply no longer
# routed here — nothing was deleted. See docs/AI_HANDOVER.md for the decision record.
# The architecture matches server.js's own documented shape ("in production nginx
# serves the static files and proxies /api/"): this vhost is the nginx half of it.
#
# 2026-09-13 (final integration audit): nginx serves the app files itself, so the
# Content-Security-Policy that erp-api attaches in its own static mode (server.js
# APP_CSP — the policy every frontend drill runs under) was NOT reaching browsers
# in production, and no Strict-Transport-Security was sent. Both are added here:
#   - CSP on the static app only (location /), byte-for-byte APP_CSP. API responses
#     keep the API's own, stricter CSP (default-src 'none'), so it is not repeated
#     on /api/. nginx resets inherited add_header lines inside a location that has
#     its own, hence the five server-level headers are repeated in location /.
#   - HSTS on every response, one year, no preload and no includeSubDomains (other
#     hostnames under mythosprod.xyz are separate services). Rollback = max-age=0.
server {
    server_name erp.mythosprod.xyz;

    root /home/deploy/projects/mythos-prod/sites/erp.mythosprod.xyz/app;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # No dotfiles, no VCS metadata. api/, db/, deploy/ and *.md live outside this
    # root entirely (siblings of app/), so they are unreachable by path already;
    # this is defense in depth against a future misplaced file.
    location ~ /\. {
        deny all;
    }

    # There is no PHP anywhere under the new app root; refuse it outright so a
    # misplaced file can never be executed or served.
    location ~ \.php$ {
        return 404;
    }

    # API: reverse-proxy to erp-api (loopback-only Node process). No URI on
    # proxy_pass, so the full original path (/api/v1/...) is forwarded
    # unchanged, matching erp-api's own route table exactly. erp-api makes its
    # own authentication/authorization/rate-limit decisions; nginx adds no
    # bypass and strips nothing.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16m;
    }

    # Static frontend: read-only, no directory listing (no autoindex), no
    # traversal outside root (nginx resolves $uri against root itself).
    # The app has no inline script, style or handler (frontend-check enforces
    # it), so the same CSP erp-api serves in ERP_SERVE_APP=1 mode applies.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri $uri/ =404;
    }

    # ACME HTTP-01. Certbot's nginx authenticator manages this dynamically at
    # renewal time; this static fallback keeps a valid target under the new
    # root in case it is ever needed outside that flow.
    location ^~ /.well-known/acme-challenge/ {
        root /home/deploy/projects/mythos-prod/sites/erp.mythosprod.xyz/app;
        default_type "text/plain";
        try_files $uri =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/erp.mythosprod.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erp.mythosprod.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = erp.mythosprod.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name erp.mythosprod.xyz;
    return 404; # managed by Certbot


}
