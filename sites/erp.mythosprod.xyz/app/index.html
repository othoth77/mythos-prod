<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mythos ERP</title>
<meta name="description" content="Mythos ERP — gestion multi-entités : clients, projets, planning, production, finance, factures, documents, inventaire.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/mythos-favicon.svg">
<meta name="theme-color" content="#0E0E0D">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/erp.css">
<script type="module" src="assets/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Aller au contenu</a>

<!-- Login: the only thing an unauthenticated visitor sees. No data, no shell. -->
<section class="login" id="login" hidden>
  <form class="login-card card" id="login-form" novalidate>
    <div class="rail-brand"><span class="wordmark">MYTHOS</span><span class="unit">ERP</span></div>
    <h1>Connexion</h1>
    <p class="login-sub">Accès réservé aux membres d'une entité.</p>
    <div class="field">
      <label for="login-email">Adresse e-mail</label>
      <input class="input" id="login-email" name="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="login-password">Mot de passe</label>
      <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" minlength="12" required>
    </div>
    <p class="error" id="login-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary" id="login-submit">Se connecter</button>
  </form>
</section>

<!-- Application shell: hidden until a session exists. -->
<div class="app" id="app" hidden>
  <nav class="rail" aria-label="Navigation des modules">
    <div class="rail-brand">
      <a class="wordmark" href="#/dashboard">MYTHOS</a>
      <span class="unit">ERP</span>
    </div>
    <div id="rail-modules"></div>
    <div class="rail-foot">
      <span class="badge info" id="rail-tenant"></span>
    </div>
  </nav>

  <header class="topbar">
    <h1 id="topbar-title">Tableau de bord</h1>
    <div class="topbar-tools">
      <label class="sr-only" for="tenant-select">Entité active</label>
      <select class="select select-sm" id="tenant-select" aria-label="Entité active"></select>
      <span class="topbar-user" id="topbar-user"></span>
      <button type="button" class="btn btn-secondary btn-sm" id="logout">Déconnexion</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <p id="route-live" class="sr-only" aria-live="polite"></p>
    <div id="view"></div>
  </main>
</div>

<!-- Overlay roots: toasts (polite live region) and modal dialogs. -->
<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="modal-root"></div>
</body>
</html>
