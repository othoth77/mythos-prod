<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mythos Status Center</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0b0d; color: #f4f4f2;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 34rem; padding: 2rem; border-top: 1px solid #3a3a40; }
  h1 { font-size: 1.1rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; margin: 0 0 .75rem; }
  p { margin: .4rem 0; line-height: 1.55; color: #b9b9b3; font-size: .95rem; }
  .tag { display: inline-block; margin-bottom: 1.25rem; padding: .2rem .6rem; border: 1px solid #3a3a40; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: #8f8f89; }
</style>
</head>
<body>
<main>
  <span class="tag">Provisioning</span>
  <h1>Mythos Status Center</h1>
  <p>This hostname is reserved for the Mythos Status Center.</p>
  <p>The Status Center service is being provisioned and does not publish live status information yet.</p>
</main>
</body>
</html>
