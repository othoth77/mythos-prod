# /etc/systemd/system/mythos-status-monitor.service.d/20-bounds.conf
#
# MYTHOS Guardian 2026-09-14 — the Status Center collector had no memory or
# time bound. A hung HTTPS probe or a runaway snapshot could hold memory or
# overlap the next 5-minute run indefinitely. Measured normal footprint of
# one run: < 60 MB for < 10 s.
#
# Rollback: rm this file && systemctl daemon-reload.
[Service]
MemoryMax=192M
TimeoutStartSec=120
