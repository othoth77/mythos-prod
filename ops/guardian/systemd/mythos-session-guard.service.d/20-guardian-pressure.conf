# /etc/systemd/system/mythos-session-guard.service.d/20-guardian-pressure.conf
#
# MYTHOS Guardian 2026-09-14 — give the session guard a pressure level it can
# actually read.
#
# DEFECT FIXED. The runner's default MYTHOS_SESSION_GUARD_RG_STATE is
# /home/deploy/.mythos-ai-executor/resource-guard.json (dot prefix). The
# Resource Guard really writes /home/deploy/mythos-ai-executor/resource-guard.json,
# so pressureLevel() failed open to NORMAL on every tick since install and
# the pressure-lowered idle threshold (15 min) could never engage.
#
# Guardian publishes the same two fields (level, updated_at) from its own
# root-side copy of the Resource Guard, which does not die with user@1001.
# If Guardian stops, the file ages past 5 minutes and the session guard
# falls back to NORMAL — exactly its behaviour before this drop-in.
#
# Changes nothing about enforcement: without the session guard's own marker
# it still only observes. Rollback: rm this file && systemctl daemon-reload.
[Service]
Environment=MYTHOS_SESSION_GUARD_RG_STATE=/var/lib/mythos-guardian/public/memory-level.json
