# Memory-pressure protection for the root LOGIN SESSION slice — MYTHOS, gh-issue-144
#
# WHY. Every Claude Desktop Remote session (`ccd-cli`) is a child of
# `/root/.claude/remote/srv/<rev>/server --serve`, which runs inside a root
# login-session scope and therefore inside `user-0.slice`. On 2026-09-03
# fourteen accumulated sessions held ~2.6 GiB there, against production
# services that live under `user-1001.slice`. The Session Guard bounds the
# COUNT of those processes; this bounds the memory the whole root session
# slice may hold before the kernel starts reclaiming from it first.
#
# SOFT LIMIT ONLY, ON PURPOSE. MemoryHigh is a throttle: crossing it puts
# the slice under reclaim pressure and slows its allocations. It NEVER
# kills. MemoryMax is deliberately NOT set here — a hard cap on the root
# login slice would OOM-kill whatever root process happened to allocate at
# the wrong moment, which is exactly the uncontrolled outcome gh-issue-144
# forbids. If a hard cap is ever wanted, it is a separate owner decision
# with its own evidence.
#
# This complements, and does not replace, ops/oom/user@1001.service.d/oom.conf
# (kill-priority parity for the deploy user manager) and the Resource
# Guard's admission control (gh-issue-101). Those three are independent:
# this one changes who feels memory pressure first, the Session Guard
# changes how many processes accumulate, and the Resource Guard changes
# whether MYTHOS starts new work.
#
# INSTALL (root):
#   sudo install -d -m 0755 /etc/systemd/system/user-0.slice.d
#   sudo install -m 0644 ops/session-guard/user-0.slice.d/memory.conf \
#        /etc/systemd/system/user-0.slice.d/memory.conf
#   sudo systemctl daemon-reload
#   systemctl show user-0.slice -p MemoryHigh      # expect 2147483648
#
# ROLLBACK:
#   sudo rm /etc/systemd/system/user-0.slice.d/memory.conf
#   sudo systemctl daemon-reload
#
# VERIFY the pressure it creates is real and bounded:
#   cat /sys/fs/cgroup/user.slice/user-0.slice/memory.current
#   cat /sys/fs/cgroup/user.slice/user-0.slice/memory.pressure
# ── REVISED 2026-09-18 (VPS OOM hardening) ────────────────────────────────
# The 2026-09-18 storm (07:34-10:43 UTC) is the evidence the paragraph
# above asked for. One root session scope held ~3.9 GB, swap reached
# 4095/4095 MB, ~130 processes were OOM-killed across the whole host, and
# the host then hung for 285 minutes until a hard reboot. A soft MemoryHigh
# does not bound SWAP: throttled pages are swapped out, and that is how the
# global swap filled. The "arbitrary" kill this file set out to avoid is
# therefore already happening, host-wide, and to production.
#
# Now: MemoryHigh 3.5G (soft, unchanged in spirit), MemoryMax 4.5G (hard)
# and MemorySwapMax 1G. A runaway in the root login slice now ends as a
# cgroup-LOCAL OOM kill — the kernel picks the largest process INSIDE this
# slice, in practice an agent session (ccd-cli, 250-450 MB) — instead of a
# global OOM that picks from everything on the host.
#
# LIVE since 2026-09-18 17:20 UTC via `systemctl set-property` (persistent in
# /etc/systemd/system.control/user-0.slice.d/50-Memory*.conf, which take
# precedence over this file). Installing this file too is harmless: same values.
#
# ROLLBACK (live, no restart):
#   systemctl set-property user-0.slice MemoryMax=infinity MemorySwapMax=infinity
#   (and MemoryHigh=infinity to remove the soft cap as well)
[Slice]
MemoryHigh=3584M
MemoryMax=4608M
MemorySwapMax=1G
MemoryAccounting=yes
