# MYTHOS maintenance DAG — governed restart of the deploy-user executor unit
# ops/dagu/maintenance/executor-restart.yaml
#
# Replaces AUTOPILOT-0 §7 (lib/autopilot/restart.js, 283 lines: request /
# approval / consume records). The approval is Dagu's own step approval
# (PoC test 11): the gate step runs, the run pauses at `waiting`, and the
# restart step has no log until a human POSTs the approval with approval_ref
# (the MYTHOS governance approval id). No schedule: started by a human or by
# the executor's hostops path, never by a timer. Deploy restarts a deploy
# user unit — no root, no sudo, no hostops allowlist change.
description: "Restart mythos-ai-executor.service (deploy user unit) after main moved — only when drift says EXECUTOR_RESTART_REQUIRED, only after explicit human approval"
type: chain
queue: mythos-maintenance
max_active_runs: 1
timeout_sec: 600
params:
  - MYTHOS_ROOT: /home/deploy/projects/mythos-prod
  - REPO: /home/deploy/projects/mythos-prod
  - TOOLS: /home/deploy/projects/mythos-prod/ops/dagu/bin
  - HEALTH: http://127.0.0.1:8130/health
steps:
  - name: resource-guard
    run: node "$MYTHOS_ROOT/projects/mythos-ai-executor/bin/mythos-resource-guard" status | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["level"]); sys.exit(0 if d.get("admit") and d.get("level") != "CRITICAL" else 3)'
  - name: no-running-task
    run: curl -sf -m 5 "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); q=(d.get("checks") or {}).get("queue") or {}; r=int(q.get("RUNNING") or 0); print("running", r); sys.exit(0 if r == 0 else 3)'
  - name: restart-required
    run: '"$TOOLS/mythos-drift-check" "$REPO" --health "$HEALTH" --require-restart'
  - name: plan
    run: echo "PLAN — restart mythos-ai-executor.service (deploy user unit) so the daemon loads the checkout HEAD; waiting for human approval"
    approval:
      prompt: "Approve the executor restart? Provide approval_ref (MYTHOS governance approval id or PR number)."
      input: [approval_ref]
      required: [approval_ref]
  - name: restart
    run: echo "approval_ref=$approval_ref" && systemctl --user restart mythos-ai-executor.service
  - name: verify
    run: '"$TOOLS/mythos-drift-check" "$REPO" --health "$HEALTH" --no-fetch --wait-current 90'
