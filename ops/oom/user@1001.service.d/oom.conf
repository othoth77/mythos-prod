# OOM kill-priority correction for the DEPLOY user manager — MYTHOS, 2026-09-01
#
# WHY. /usr/lib/systemd/system/user@.service sets OOMScoreAdjust=100 on every
# user manager. The 2026-09-01 remediation set the eight deploy PRODUCTION
# services to 0 (~deploy/.config/systemd/user/*.service.d/oom.conf), but the
# manager they all hang from kept 100. At 22:16:42 UTC the kernel picked that
# 3 MB manager (badness ~ +10 % of RAM from the adjustment) over 250 MB agent
# sessions at 0, and systemd then SIGKILLed every service under it:
# idauto-api, mythos-ai-executor, mythos-command-center, mythos-os-console,
# oth-knowledge-http, spy, spy-monitor, ssangyong-storefront. user@.service
# has Restart=no, so nothing brought them back until a human did.
#
# This sets the manager to 0 — parity, not privilege — so it is judged on its
# own 3 MB. It does not reduce memory pressure; closing idle agent sessions
# does that.
#
# INSTALL (root):   see ops/oom/README.md
# ROLLBACK:         rm /etc/systemd/system/user@1001.service.d/oom.conf; systemctl daemon-reload
[Service]
OOMScoreAdjust=0
