# Memory ceiling — MYTHOS VPS OOM hardening, 2026-09-18
#
# WHY. On 2026-09-18 a global OOM storm (07:34-10:43 UTC, swap 4095/4095M)
# hung the host until a hard reboot. oom.conf beside this file only decides
# WHO dies; this file bounds HOW MUCH this unit may take, so a leak here ends
# as a cgroup-local OOM + Restart=on-failure instead of pressure on the host.
# Heap (old-space) is sized so V8 total heap (old + ~48 MB young gen) plus
# native memory stays under MemoryMax: V8 aborts cleanly before the cgroup kills.
#
# ROLLBACK: rm this file; systemctl --user daemon-reload; restart the unit.
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=128
