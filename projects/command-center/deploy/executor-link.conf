# OTHMODE V2 — command runs (OTHMODE → executor task).
# Drop-in for the user unit: ~/.config/systemd/user/mythos-command-center.service.d/executor-link.conf
#
# Enables POST /api/othmode/commands/:slug/run. Without OTHMODE_EXECUTOR_TOKEN_FILE
# the edge is disabled and says so (GET /api/othmode/run-config).
# The token file is the executor's own bearer file (0600, deploy-owned,
# outside Git), reused rather than duplicated; it is read at call time,
# sent only as an Authorization header on loopback, and never logged,
# returned or stored. Runs are advisory tasks (repo-read, no Git report).
[Service]
Environment=OTHMODE_EXECUTOR_URL=http://127.0.0.1:8130
Environment=OTHMODE_EXECUTOR_TOKEN_FILE=/home/deploy/.config/mythos-ai-executor/executor.env
Environment=OTHMODE_EXECUTOR_PROJECT=mythos-prod
