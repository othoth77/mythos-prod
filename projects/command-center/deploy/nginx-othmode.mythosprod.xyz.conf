# OTHMODE — nginx vhost for othmode.mythosprod.xyz
#
# Install at /etc/nginx/sites-available/othmode.mythosprod.xyz and symlink
# into sites-enabled. Identical reverse-proxy shape to the sibling vhost
# nginx-ordre.mythosprod.xyz.conf: BOTH hosts proxy to the same application
# process (127.0.0.1:3021) — OTHMODE is the adapted Command Center, not a
# second service. ordre.mythosprod.xyz stays up during the migration as the
# recoverable legacy host; retiring it later is an owner decision.
#
# THIS FILE IS THE PRE-TLS FORM. certbot rewrites it in place when the
# certificate is issued (listen 443 + redirect), exactly as it did for the
# sibling vhosts. Do not hand-write the 443 block; let certbot own it.
#
# PREREQUISITES (owner/operator actions, in order):
#   1. DNS: an A record othmode.mythosprod.xyz -> 51.68.226.211 must exist
#      (DNS changes are an owner-approval action, AGENTS.md §25.3).
#   2. Install this file + enable + `nginx -t` + reload (via the admin path).
#   3. certbot --nginx -d othmode.mythosprod.xyz
#   4. Add the `othmode` target to /usr/local/sbin/mythos-deploy (the repo
#      copy at ops/vps-admin/mythos-deploy already carries it; root
#      reinstalls the tool from the repo).

server {
    listen 80;
    listen [::]:80;
    server_name othmode.mythosprod.xyz;

    # Same ceiling as the ordre vhost: long text bodies, no uploads; the
    # API itself caps a JSON body at 512 KB (api.js MAX_BODY_BYTES).
    client_max_body_size 1M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
    }

    # A private working tool, not a public document.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
