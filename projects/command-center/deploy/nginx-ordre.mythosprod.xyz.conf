# MYTHOS AI COMMAND CENTER — nginx vhost for ordre.mythosprod.xyz (MCC-1)
#
# Install at /etc/nginx/sites-available/ordre.mythosprod.xyz and symlink
# into sites-enabled. Follows the same reverse-proxy shape already in use
# on this host for panel.mythosprod.xyz and tv.mythosprod.xyz.
#
# THIS FILE IS THE PRE-TLS FORM. certbot rewrites it in place when the
# certificate is issued, adding the listen 443 block and the redirect —
# exactly as it did for the sibling vhosts, whose "# managed by Certbot"
# lines are the record of that. Do not hand-write the 443 block here;
# let certbot own it so renewal keeps working.
#
# PREREQUISITE, NOT SATISFIED AT THE TIME THIS WAS WRITTEN:
#   ordre.mythosprod.xyz must resolve to this host (51.68.226.211).
#   `dig +short ordre.mythosprod.xyz` returned nothing, and there is no
#   wildcard record on mythosprod.xyz. DNS is an owner-approval action
#   (AGENTS.md §25.3) and no OVH API credential is configured here, so the
#   A record must be created by the owner at OVH before certbot can run.

server {
    listen 80;
    listen [::]:80;
    server_name ordre.mythosprod.xyz;

    # Command bodies are long text, not uploads. There is no upload path in
    # this application, so the request ceiling is small on purpose — the API
    # itself caps a JSON body at 512 KB (api.js MAX_BODY_BYTES).
    client_max_body_size 1M;

    # The application sets its own Content-Security-Policy per asset; these
    # are the transport-level headers nginx is better placed to guarantee.
    # They overlap with the page's own headers on HTML responses, which is
    # intentional: JSON API responses get nosniff from the application but
    # not X-Frame-Options, and this covers every response uniformly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
    }

    # The application is a private working tool, not a public document.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
