# SSANGYONG.AUTOS storefront — nginx server block (SYA-DEPLOY-1 artifact)
#
# NOT INSTALLED, and NOT INSTALLABLE AS-IS: __STOREFRONT_HOST__ is a
# placeholder. The storefront's public hostname has never been decided in any
# document in this repository, and choosing it is an owner decision — it is the
# product's public identity. See deploy/README.md.
#
# Install to /etc/nginx/sites-available/__STOREFRONT_HOST__ and symlink into
# sites-enabled. Requires root: `deploy` cannot write /etc/nginx.
#
# THIS FILE MUST NOT BE APPLIED TO THE APEX ssangyong.autos. That name serves
# the legacy MariaDB site from /var/www/ssangyong.autos, which migration-plan
# §21 freezes and ratified §22 option 3 retires "later", under its own owner
# order. Pointing the apex here would take the legacy site down.
#
# Modelled on the existing /etc/nginx/sites-available/n8n.ssangyong.autos,
# which is this host's established pattern for exposing a loopback service
# under this domain. TLS lines are deliberately omitted: run
# `certbot --nginx -d __STOREFRONT_HOST__` after this block exists and after
# the DNS A record resolves, and certbot writes them itself, exactly as it did
# for every other site here.

server {
    listen 80;
    listen [::]:80;
    server_name __STOREFRONT_HOST__;

    # Small, static, cacheable catalogue pages.
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 512;

    # The upstream sets its own Content-Security-Policy, X-Content-Type-Options
    # and Referrer-Policy per response; they are not duplicated here. These two
    # are transport-level and belong to the edge.
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/ssangyong-storefront.access.log;
    error_log  /var/log/nginx/ssangyong-storefront.error.log;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # The upstream is GET-only and answers 405 to anything else, but refusing
    # write verbs at the edge means they never reach the application at all.
    location ~ ^/api/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3011/api/health;
        access_log off;
    }
}
