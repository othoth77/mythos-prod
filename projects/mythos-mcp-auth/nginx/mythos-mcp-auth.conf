    # ------------------------------------------------------ mcp-auth (OAuth)
    # MYTHOS MCP OAuth bridge (mcp-auth-proxy, 127.0.0.1:8180) and its
    # identity provider (Dex, 127.0.0.1:5556). Claude Web connects to
    # https://mythosprod.xyz/mcp and discovers the authorization server on
    # this same origin. The existing /gateway/ route is untouched: this is a
    # second door that opens onto the same ContextForge, with OAuth in front.
    # Source of truth: projects/mythos-mcp-auth/nginx/ in the repository.

    # RFC 9728 / RFC 8414 discovery. Only the two OAuth well-known documents
    # (and their per-resource suffix forms) are routed; nothing else under
    # /.well-known/ changes.
    location ^~ /.well-known/oauth-protected-resource {
        limit_req zone=mcp_auth_oauth burst=60 nodelay;
        include snippets/mythos-mcp-auth-proxy.conf;
    }
    location ^~ /.well-known/oauth-authorization-server {
        limit_req zone=mcp_auth_oauth burst=60 nodelay;
        include snippets/mythos-mcp-auth-proxy.conf;
    }

    # OAuth 2.1 endpoints (RFC 7591 registration, PKCE authorize, consent,
    # IdP callback, token). Exact matches only.
    location = /register  { limit_req zone=mcp_auth_oauth burst=40 nodelay; include snippets/mythos-mcp-auth-proxy.conf; }
    location = /authorize { limit_req zone=mcp_auth_oauth burst=40 nodelay; include snippets/mythos-mcp-auth-proxy.conf; }
    location = /consent   { limit_req zone=mcp_auth_oauth burst=40 nodelay; include snippets/mythos-mcp-auth-proxy.conf; }
    location = /callback  { limit_req zone=mcp_auth_oauth burst=40 nodelay; include snippets/mythos-mcp-auth-proxy.conf; }
    location = /token     { limit_req zone=mcp_auth_oauth burst=60 nodelay; include snippets/mythos-mcp-auth-proxy.conf; }

    # The protected MCP mount. Bearer-checked by the proxy, then relayed to
    # ContextForge with the proxy's own upstream credential.
    location = /mcp  { include snippets/mythos-mcp-auth-proxy.conf; }
    location ^~ /mcp/ { include snippets/mythos-mcp-auth-proxy.conf; }

    # Dex (OIDC issuer https://mythosprod.xyz/dex). The login form is the one
    # password surface on this origin: tight rate limit.
    location ^~ /dex/auth {
        limit_req zone=mcp_auth_login burst=15 nodelay;
        include snippets/mythos-mcp-auth-dex.conf;
    }
    location ^~ /dex/ {
        limit_req zone=mcp_auth_oauth burst=60 nodelay;
        include snippets/mythos-mcp-auth-dex.conf;
    }
