# MYTHOS MCP OAuth bridge — request-rate zones (http context).
# Source of truth: projects/mythos-mcp-auth/nginx/ in the mythos-prod repository.
# The proxy has its own per-IP limiter; this is the outer bound for the two
# surfaces that face a browser without a token: the Dex login form and the
# OAuth pre-auth endpoints.
limit_req_zone $binary_remote_addr zone=mcp_auth_login:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=mcp_auth_oauth:1m rate=120r/m;
# A throttled caller gets 429 (the OAuth/MCP clients understand Retry-After
# semantics), not nginx's default 503 which reads as an outage.
limit_req_status 429;
