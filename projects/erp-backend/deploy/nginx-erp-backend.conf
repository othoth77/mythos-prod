# ══════════════════════════════════════════════════════════════════════
# Mythos ERP secure backend — nginx vhost (PREPARED, do NOT enable until the
# security gates in the README pass and the owner approves DNS/TLS).
#
# Only projects/erp-backend/public is the web root. src/, cli/, tests/, the
# SQLite DB and the uploads directory are OUTSIDE it and never web-served.
# PHP runs ONLY through the front controller; no PHP executes in the uploads
# store. This is the counterpart to the frontend's static vhost.
# ══════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name erp.mythosprod.xyz;   # served only after DNS + certbot (owner action)

    # Web root is the public/ directory ONLY.
    root /var/www/erp-backend/public;
    index index.php;

    # Uploads and the database live OUTSIDE this root (e.g.
    #   /var/lib/erp-backend/uploads , /var/lib/erp-backend/erp.db )
    # so they are never directly reachable and never executed.

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 12m;   # aligns with ERP_MAX_UPLOAD_BYTES

    # Everything is routed through the single front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP is executed ONLY for the front controller. Any other .php path 404s,
    # so a stray file cannot be run.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;   # match the host's FPM socket
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # Backend configuration is injected here (never committed):
        #   fastcgi_param ERP_DB_DRIVER  "sqlite";
        #   fastcgi_param ERP_DB_PATH    "/var/lib/erp-backend/erp.db";
        #   fastcgi_param ERP_UPLOAD_DIR "/var/lib/erp-backend/uploads";
        #   fastcgi_param ERP_ALLOWED_ORIGIN "https://<frontend-origin>";
        #   fastcgi_param ERP_COOKIE_SECURE "1";
        # Prefer an env file / systemd EnvironmentFile over inline params.
    }
    location ~ \.php$ { return 404; }

    # Dotfiles denied.
    location ~ /\. { deny all; }
}
