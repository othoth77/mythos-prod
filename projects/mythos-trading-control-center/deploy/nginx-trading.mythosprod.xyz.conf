# MYTHOS TRADING CONTROL CENTER — nginx vhost for trading.mythosprod.xyz
#
# Install at /etc/nginx/sites-available/trading.mythosprod.xyz and symlink into
# sites-enabled. Same reverse-proxy shape as the sibling vhosts on this host
# (os, ordre, tv).
#
# PRE-TLS FORM. certbot rewrites this file in place when the certificate is
# issued, adding the listen 443 block and the redirect. Do not hand-write the
# 443 block; let certbot own it so renewal keeps working:
#     certbot --nginx -d trading.mythosprod.xyz
#
# PREREQUISITE — verified 2026-10-01 on the host:
#     getent hosts trading.mythosprod.xyz   →  51.68.226.211 (this VPS)
# Until this vhost exists the name falls through to the default server, which
# redirects to another site; that is why the name "works" before deployment.
#
# The application is the authority on its own security headers (CSP, HSTS,
# frame, referrer, permissions) and sets them on every response it produces.
# The three repeated here cover responses nginx produces itself (502, 413).

server {
    listen 80;
    listen [::]:80;
    server_name trading.mythosprod.xyz;

    # The API refuses bodies over 64 KB; nginx refuses them first.
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # The paper control room's live event stream (Server-Sent Events).
    # Buffering would hold events back until the buffer filled.
    location = /api/paper/stream {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
    }
}
