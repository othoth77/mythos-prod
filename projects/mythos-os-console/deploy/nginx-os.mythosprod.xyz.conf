# MYTHOS OS COMMAND CENTER — nginx vhost for os.mythosprod.xyz (MOS-1)
#
# Install at /etc/nginx/sites-available/os.mythosprod.xyz and symlink into
# sites-enabled. Same reverse-proxy shape as the sibling vhosts already on
# this host (panel, tv, ordre).
#
# PRE-TLS FORM. certbot rewrites this file in place when the certificate is
# issued, adding the listen 443 block and the redirect. Do not hand-write
# the 443 block; let certbot own it so renewal keeps working.
#
# PREREQUISITE — SATISFIED. CORRECTED 2026-08-18 (MOS-1.1):
#   os.mythosprod.xyz resolves to 51.68.226.211. MOS-1 stated that no
#   record existed; that claim was carried over from the sibling service's
#   vhost comment and was never checked by resolving the name. It was
#   wrong. Two fabricated subdomains of mythosprod.xyz return NXDOMAIN
#   from the same resolver, so this is a real record and not a wildcard.
#
#   Verify on the host before relying on it — the check above was made
#   from a sandbox that cannot reach the origin:
#       getent hosts os.mythosprod.xyz
#   or run projects/mythos-os-console/tools/host-preflight.sh, which
#   checks this and every other precondition and refuses to pass if any
#   of them is missing.
#
#   Installing this file still needs root, and certbot still needs the
#   vhost in place first.

server {
    listen 80;
    listen [::]:80;
    server_name os.mythosprod.xyz;

    # The console is read-only: it accepts no request body of any kind, and
    # server.js answers 405 to every method but GET and HEAD. The ceiling is
    # small because nothing legitimate needs it.
    client_max_body_size 16k;

    # Transport-level headers, guaranteed on every response including the
    # JSON API. They overlap with the headers the application sets on its
    # own responses; that overlap is intentional and harmless.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8140;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
    }

    # An operations console is not a public document.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
