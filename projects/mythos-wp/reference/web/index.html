<!DOCTYPE html>
<!--
  MYTHOS WP — application shell
  projects/mythos-wp/reference/web/index.html
  Served only to an authenticated session. No inline script/style (CSP).
  Views are rendered by /js/app.js (ES modules) into <main>.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>MYTHOS WP</title>
  <link rel="stylesheet" href="/brand/tokens.css">
  <link rel="stylesheet" href="/brand/fonts.css">
  <link rel="stylesheet" href="/wp.css">
  <link rel="icon" type="image/svg+xml" href="/brand/mythos-favicon.svg">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app" id="app">
    <nav class="rail" id="rail" aria-label="Main">
      <div class="rail-brand"><a class="wordmark" href="#/dashboard">MYTHOS</a><span class="unit">WP</span></div>
      <div class="rail-nav" id="nav"></div>
      <div class="rail-foot" id="rail-foot"></div>
    </nav>
    <header class="topbar">
      <div class="topbar-left">
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      </div>
      <div class="topbar-tools">
        <label class="project-switch"><span class="sr-only">Project</span><select class="select" id="project-select" aria-label="Project"></select></label>
        <button class="search-btn" id="search-btn" type="button" aria-label="Search and commands"><span class="label">Search parts, vehicles, knowledge…</span><kbd>Ctrl K</kbd></button>
        <button class="btn btn-ghost btn-icon" id="theme-btn" type="button" aria-label="Toggle theme" title="Toggle theme">◐</button>
      </div>
    </header>
    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <dialog id="cmd" class="cmd"></dialog>
  <script src="/js/validate.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
