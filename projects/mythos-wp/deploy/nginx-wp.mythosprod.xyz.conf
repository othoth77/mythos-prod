# MYTHOS WP — nginx vhost for wp.mythosprod.xyz
#
# Install at /etc/nginx/sites-available/wp.mythosprod.xyz, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`, then
# `certbot --nginx -d wp.mythosprod.xyz` — certbot rewrites this file in place
# (443 block + redirect); do not hand-write the TLS block.
#
# Same reverse-proxy shape as the sibling vhosts (os, panel, ordre). The
# upstream binds 127.0.0.1:8170 only. Application headers (CSP, nosniff,
# frame deny, referrer, COOP/CORP) are set by server.js; the transport ones
# repeated here guarantee them on every response nginx emits itself.

server {
    server_name wp.mythosprod.xyz;

    # JSON bodies are capped at 256 KiB by the application; keep nginx aligned.
    client_max_body_size 512k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8170;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
    }

    # An administration panel is not a public document.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    listen 80;
    listen [::]:80;
}
