    # ---------------------------------------------------------------- gateway
    # MYTHOS Gateway (ContextForge) — the single HTTPS door for remote MCP
    # clients. Mounted on a path of an existing certificate rather than a new
    # subdomain: mythosprod.xyz is served by OVH DNS with no API credential on
    # this host, so a new record is an owner action and a path is not.
    #
    # ContextForge is told APP_ROOT_PATH=/gateway, so it builds its own URLs
    # correctly behind this prefix. It listens on loopback only; this block is
    # the only route to it from outside the host.
    #
    # The admin UI and admin API are disabled in the gateway's own
    # configuration. These two blocks are the second lock: even if that
    # configuration were ever changed, the surfaces stay unreachable from the
    # internet.
    location = /gateway/admin { return 404; }
    location ^~ /gateway/admin/ { return 404; }

    location ^~ /gateway/ {
        proxy_pass http://127.0.0.1:4444/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /gateway;

        # MCP Streamable HTTP keeps a response open and streams events onto
        # it. Buffering would hold those events until the response closed,
        # which for a long tool call is indistinguishable from a hang.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # A tool call reaches a real upstream — knowledge, the executor, the
        # GitHub API. The gateway's own timeout is the one that should fire.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        client_max_body_size 4m;

        # add_header in a location replaces the inherited set, so the headers
        # that matter for a JSON API are restated here. The Hub's CSP is for
        # an HTML document and is deliberately not carried over.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
    }
