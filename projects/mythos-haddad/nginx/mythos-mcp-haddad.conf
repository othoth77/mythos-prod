    # ------------------------------------------------ /mcphaddad (HAD-3c)
    # https://mythosprod.xyz/mcphaddad -> the EXISTING Haddad MCP bridge behind
    # Tailscale Serve (https://haddad.tail23f990.ts.net/mcp). No server, bridge
    # or auth layer of its own: nginx relays the client's Authorization header
    # untouched and the Haddad bridge alone decides (401 without/with a wrong
    # bearer). The VPS never holds the Haddad bearer.
    # Reachable only because the VPS is a tailnet member (tag:mythos-vps, ACL
    # to haddad:443 only). The upstream is the node's tailnet IP, so this file
    # loads (and /mcp keeps working) even when tailscaled is down: the request
    # then fails 502 instead of the config failing to load.
    # Exact match only: /mcp and /mcp/ stay with snippets/mythos-mcp-auth.conf.
    # Source of truth: projects/mythos-haddad/nginx/ in the repository.
    location = /mcphaddad {
        proxy_pass https://100.78.7.10/mcp;
        proxy_ssl_server_name on;
        proxy_ssl_name haddad.tail23f990.ts.net;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host haddad.tail23f990.ts.net;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        # Streamable HTTP: never buffer a streamed MCP response.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 4m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
    }
